name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: php tests/regression.php
        env:
          MENGINE_REDIS_DRIVER: predis
